<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Redirecionando para o WhatsApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <p class="eyebrow">Controle de Leads</p>
        <h1>Estamos te levando para o WhatsApp</h1>
        <p class="copy">
          O clique está sendo registrado para controle comercial e, em seguida,
          você será redirecionado para a vendedora responsável.
        </p>
        <div class="status" id="status">Preparando redirecionamento...</div>
        <a id="manual-link" class="manual-link" href="#">
          Se o redirecionamento não acontecer, toque aqui
        </a>
      </section>
    </main>

    <script src="./redirect.js"></script>
  </body>
</html>
